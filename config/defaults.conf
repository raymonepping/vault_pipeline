# config/defaults.conf: tracked defaults for image pins, host ports, addresses
# and story timings. scripts/compose.sh loads this file first and .env second,
# so any value can be overridden in .env without editing a compose file.
# scripts/common.sh, scripts/ports-check.sh and e2e/helpers/env.ts read the
# same names. Dependabot cannot parse this file: bump images here by hand,
# then run make verify, make rehearsal and make probe.

# ── Images (arm64; check Architecture after every pull) ───────────────────────
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
ALPINE_IMAGE=docker.io/library/alpine:3.24.1
KEYCLOAK_IMAGE=docker.io/keycloak/keycloak:26.8.1
OPENLDAP_IMAGE=docker.io/osixia/openldap:1.5.0
POSTGRES_IMAGE=docker.io/pgvector/pgvector:0.8.7-pg18-trixie
OLLAMA_IMAGE=docker.io/ollama/ollama:0.13.5

# ── Models (D16) ──────────────────────────────────────────────────────────────
VPIP_EMBED_MODEL=nomic-embed-text:v1.5
VPIP_CHAT_MODEL=qwen2.5:1.5b
# The ID `ollama list` shows (the digest's first 12 hex): Ansible models checks it.
VPIP_EMBED_MODEL_ID=0a109f422b47
VPIP_CHAT_MODEL_ID=65ec06548149

# ── Host ports (all published on 127.0.0.1) ───────────────────────────────────
# Next to vault_balancing (19100s, 19190s) and vault_codex (19000s, 13700s).
VPIP_PORT_VAULT_S=19300
VPIP_PORT_VAULT_1=19301
VPIP_PORT_VAULT_2=19302
VPIP_PORT_VAULT_3=19303
VPIP_PORT_API=13800
VPIP_PORT_WEB=13801
VPIP_PORT_KEYCLOAK=13802

# ── Network: workloads have static addresses because their tokens are bound
# to them (D9). config/pipeline.json names the same addresses.
VPIP_SUBNET=10.89.230.0/24
# Containers without a static address get one from here (above .128).
VPIP_IP_RANGE=10.89.230.128/25
VPIP_IP_VAULT_S=10.89.230.5
VPIP_IP_VAULT_1=10.89.230.2
VPIP_IP_VAULT_2=10.89.230.3
VPIP_IP_VAULT_3=10.89.230.4
VPIP_IP_SCRIBE=10.89.230.11
VPIP_IP_KEEPER=10.89.230.12
VPIP_IP_LIBRARIAN=10.89.230.13
VPIP_IP_CONSOLE=10.89.230.14

# ── Console ───────────────────────────────────────────────────────────────────
VPIP_WEB_CN=pipeline.localhost
# How long the presenter stays signed in without a click, and at most.
VPIP_SESSION_IDLE=14400
VPIP_SESSION_MAX=43200

# ── Story timing (D9, D10, D13) ───────────────────────────────────────────────
VPIP_TRUST_DOMAIN=pipeline.lab
VPIP_SVID_TTL=60
VPIP_WRAP_TTL=300
VPIP_PERSON_TTL=120

# ── Application images (make app-build) ───────────────────────────────────────
VPIP_IMAGE_PREFIX=localhost/vault-pipeline
VPIP_IMAGE_TAG=local
